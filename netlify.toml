# Netlify. El comando y el directorio de publicación los detecta Netlify (Next.js Runtime).
#
# El escáner de secretos de Netlify falla el build si el VALOR de una variable aparece en el repo o en
# la salida. Estas cuatro no son secretos: el nombre del bucket, la región, el endpoint y la URL
# pública de las fotos (que además va en el HTML de cada foto del sitio). Se excluyen SOLO ellas:
# DATABASE_URL, DATABASE_CA_CERT, PAYLOAD_SECRET, SPACES_KEY, SPACES_SECRET y RESEND_API_KEY
# siguen vigiladas.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SPACES_BUCKET,SPACES_REGION,SPACES_ENDPOINT,SPACES_PUBLIC_URL"
